name: JavaScript

# Runs for changes to the JavaScript workspace, the canonical migrations its
# examples and integration tests run against, and this workflow.
on:
  push:
    branches: [master]
    paths: &paths
      - ".github/workflows/js.yaml"
      - "js/**"
      - "riverdriver/**/*.sql"
  pull_request:
    paths: *paths

# Node versions to test against (last two LTS releases).
# Update these when new LTS versions are released.

defaults:
  run:
    working-directory: js

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    strategy:
      matrix: &last_two_lts_node_versions
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: js/package.json

      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
          node-version: ${{ matrix.node-version }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:all

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: js/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run fmt:check

  examples:
    name: Examples
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: river_test
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    strategy:
      matrix: *last_two_lts_node_versions

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/river_test?sslmode=disable

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: js/package.json

      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
          node-version: ${{ matrix.node-version }}

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      # Migrate with this revision's River CLI and migrations.
      - run: go run . migrate-up --database-url "$DATABASE_URL"
        working-directory: cmd/river

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:all

      - run: pnpm --filter='./examples/*' run build

      - run: pnpm --filter='./examples/*' run start

  test:
    name: Test
    runs-on: ubuntu-latest

    strategy:
      matrix: *last_two_lts_node_versions

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: js/package.json

      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
          node-version: ${{ matrix.node-version }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm run test

  test_integration:
    name: Test (integration)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: river_test
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    strategy:
      matrix: *last_two_lts_node_versions

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/river_test?sslmode=disable

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: js/package.json

      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
          node-version: ${{ matrix.node-version }}

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      # Migrate with this revision's River CLI and migrations.
      - run: go run . migrate-up --database-url "$TEST_DATABASE_URL"
        working-directory: cmd/river

      - run: pnpm install --frozen-lockfile

      - run: pnpm run test:integration
