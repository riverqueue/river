name: JavaScript

# Runs for changes to the JavaScript workspace and to everything its gates
# read from the rest of River: the shared conformance suite, the canonical
# migrations and SQL it mirrors and runs against, and this workflow. Release
# tags always run it.
on:
  push:
    branches: [master]
    paths: &paths
      - ".github/actions/setup-js/**"
      - ".github/actions/setup-js-conformance/**"
      - ".github/workflows/js.yaml"
      - "Makefile"
      - "conformance/**"
      - "js/**"
      - "riverdriver/**/*.sql"
    tags: ["v*"]
  pull_request:
    paths: *paths

concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

# The full runtime deliberately requires native Temporal from Node 26. Every
# job installs the official build selected by js/.node-version (or the matrix)
# and asserts `typeof Temporal` before doing anything else. Conformance jobs
# run River's shared harness from this checkout with the JavaScript candidate
# descriptor, js/conformance/candidate.json.

defaults:
  run:
    working-directory: js

env:
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-js

      - run: pnpm run build:all

      - run: pnpm run typecheck:tests

      - run: pnpm run typecheck:next

      # Compares the generated mirror with River's canonical migration sources.
      - run: pnpm run verify:migrations

      - run: pnpm run api:check

      - run: pnpm run docs:api

      - run: pnpm run docs:snippets

      - run: pnpm run migration:legacy

      - run: pnpm run coverage:scenarios

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-js

      # Type-aware lint reads `riverqueue` through its built declarations.
      - run: pnpm run build

      - run: pnpm run lint

      - run: pnpm run fmt:check

      - run: pnpm run license:check

      - run: pnpm audit

  packages:
    name: Package archives
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The packed `node:test` suite runs its PostgreSQL tests against this
    # database, and RIVER_REQUIRE_POSTGRES makes them fail instead of skip
    # when DATABASE_URL is missing.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: river_test
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/river_test?sslmode=disable
      RIVER_REQUIRE_POSTGRES: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-js

      - run: pnpm run build:all

      # The packed examples that need a database use its default schema.
      - run: node cli/dist/bin.js migrate-up --database-url "$DATABASE_URL"

      - run: pnpm run package:check

  examples:
    name: Examples
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: river_test
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/river_test?sslmode=disable

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-js

      - run: pnpm run build:all

      - run: node cli/dist/bin.js migrate-up --database-url "$DATABASE_URL"

      - run: pnpm run package:examples

  test:
    name: Test (Node ${{ matrix.node-version || 'from .node-version' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # The minimum supported release and the current Node 26 release.
        node-version: ["26.0.0", ""]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-js
        with:
          node-version: ${{ matrix.node-version }}

      # The unit tests import the other workspace packages through their
      # build output, and worker threads run compiled handler modules.
      - run: pnpm run build:all

      - run: pnpm run test

  test_integration:
    name: Test (integration, PostgreSQL ${{ matrix.postgres-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        postgres-version: [14, 15, 16, 17, 18]

    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_DB: river_test
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/river_test?sslmode=disable

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-js

      - run: pnpm run build:all

      - run: node cli/dist/bin.js migrate-up --database-url "$TEST_DATABASE_URL"

      - run: pnpm run test:integration

  conformance:
    name: Cross-language conformance (PostgreSQL ${{ matrix.postgres-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        postgres-version: [14, 15, 16, 17, 18]

    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_DB: river_conformance
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      # A TCP URL: the resilience scenarios reach PostgreSQL through a fault
      # proxy that rewrites its host and port.
      RIVER_CONFORMANCE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/river_conformance?sslmode=disable
      # Turn every skipped tier or scenario into a failure.
      RIVER_CONFORMANCE_REQUIRED: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-js

      - uses: ./.github/actions/setup-js-conformance

      - run: pnpm run build:all

      # SQLite storage and runtime; Go and JavaScript on PostgreSQL (mixed,
      # maintenance, and resilience); the insert-only profile; then Go, Rust,
      # and JavaScript together, including Rust and JavaScript SQLite pairs.
      - run: >-
          pnpm run test:conformance:multi-engine --
          --database-url "$RIVER_CONFORMANCE_DATABASE_URL"

  conformance_performance:
    name: Conformance performance gate (calibrating, non-blocking)
    # Release gates run for master and release tags, not every pull request.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The JavaScript thresholds were set without a GitHub runner baseline.
    # Report results without failing the workflow until they are recalibrated
    # from runner data, then make this job blocking again.
    continue-on-error: true

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: river_conformance
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      RIVER_CONFORMANCE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/river_conformance?sslmode=disable
      RIVER_CONFORMANCE_REQUIRED: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-js

      - uses: ./.github/actions/setup-js-conformance

      - run: pnpm run build:all

      # Compares Go and JavaScript enqueue, worker, and mixed throughput and
      # p95 latency against the bounds in conformance/candidate.json, alone
      # and with Rust competing, at five times the harness's default workload.
      - run: >-
          pnpm run test:conformance:performance --
          --database-url "$RIVER_CONFORMANCE_DATABASE_URL"
          --multi-engine-performance
          --performance-jobs 1000

  conformance_soak:
    name: Conformance soak (10m)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: river_conformance
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      RIVER_CONFORMANCE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/river_conformance?sslmode=disable
      RIVER_CONFORMANCE_REQUIRED: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-js

      - uses: ./.github/actions/setup-js-conformance
        with:
          rust: "false"

      - run: pnpm run build:all

      - run: >-
          pnpm run test:conformance:soak --
          --database-url "$RIVER_CONFORMANCE_DATABASE_URL"
          --soak-duration 10m
