name: Rust

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

env:
  # Keep the cross-run cache small; Cargo still reuses compiled dependencies.
  CARGO_INCREMENTAL: "0"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - uses: dtolnay/rust-toolchain@stable
        id: rust
        with:
          components: clippy,rustfmt
      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('rust/**/Cargo.toml', 'rust/Cargo.lock') }}
          restore-keys: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.cachekey }}-
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.49.0

      - name: Verify generated compatibility artifacts
        run: make verify/conformance verify/rust-migrations

      - name: Lint
        run: make lint/rust

      - name: Documentation and examples
        run: make doc/rust

      - name: Dependency and license policy
        run: make check/rust/dependencies

      - name: Package archives
        run: make check/rust/package

      - name: Public API compatibility
        run: make check/rust/semver

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        rust-version: ["1.95", "1.96", "1.97"]

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        id: rust
        with:
          toolchain: ${{ matrix.rust-version }}
      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('rust/**/Cargo.toml', 'rust/Cargo.lock') }}
          restore-keys: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.cachekey }}-
      - name: Check workspace
        run: cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --all-features --locked

  backend-features:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        id: rust
      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('rust/**/Cargo.toml', 'rust/Cargo.lock') }}
          restore-keys: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.cachekey }}-
      - name: PostgreSQL defaults
        run: cargo check --manifest-path rust/Cargo.toml -p riverqueue -p riverqueue-migrate --all-targets --locked
      - name: SQLite only
        run: cargo check --manifest-path rust/Cargo.toml -p riverqueue -p riverqueue-migrate --all-targets --no-default-features --features sqlite --locked
      - name: PostgreSQL and SQLite
        run: cargo check --manifest-path rust/Cargo.toml -p riverqueue -p riverqueue-migrate --all-targets --features sqlite --locked

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: SQLite storage and runtime conformance
        run: make test/conformance/sqlite

  postgres-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        postgres-version: [14, 15, 16, 17, 18]
    env:
      RIVER_CONFORMANCE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/river_rust_test?sslmode=disable
      RIVER_CONFORMANCE_PERFORMANCE: "1"
      RIVER_CONFORMANCE_SOAK_DURATION: 10m
      RIVER_RUST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/river_rust_test?sslmode=disable

    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - uses: dtolnay/rust-toolchain@stable
        id: rust
      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('rust/**/Cargo.toml', 'rust/Cargo.lock') }}
          restore-keys: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.cachekey }}-
      - name: Create test database
        run: PGPASSWORD=postgres createdb -h localhost -U postgres river_rust_test
      - name: Rust PostgreSQL suite
        run: make test/rust/postgres
      - name: Mixed correctness and chaos
        run: make test/conformance
      - name: Release performance
        run: make test/conformance/performance
      - name: Ten-minute mixed soak
        run: make test/conformance/soak
