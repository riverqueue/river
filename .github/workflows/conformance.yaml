name: Conformance

# The conformance harness runs River Go, Rust, and JavaScript against each
# other on one database, with Go as the reference, and the ports' fixture tests
# compare against values generated from River's Go code. So a candidate's job
# runs when its own files change or when the Go side does: Go code and
# modules, SQL, the conformance module, this workflow, or the Makefile. The
# `changes` job decides which candidates run; the paths below are the union
# of everything it checks. Keep both events' paths in sync with it.
on:
  push:
    branches:
      - master
    paths:
      - ".github/actions/setup-js/**"
      - ".github/workflows/conformance.yaml"
      - "**.go"
      - "**/go.mod"
      - "**/go.sum"
      - "Makefile"
      - "conformance/**"
      - "go.work"
      - "js/**"
      - "riverdriver/**/*.sql"
      - "rust/**"
  pull_request:
    paths:
      - ".github/actions/setup-js/**"
      - ".github/workflows/conformance.yaml"
      - "**.go"
      - "**/go.mod"
      - "**/go.sum"
      - "Makefile"
      - "conformance/**"
      - "go.work"
      - "js/**"
      - "riverdriver/**/*.sql"
      - "rust/**"

concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  # Keep the cross-run cache small; Cargo still reuses compiled dependencies.
  CARGO_INCREMENTAL: "0"

jobs:
  # Decides which candidates run from the files a pull request or push
  # changes. If the comparison can't be made, everything runs.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      go: ${{ steps.check.outputs.go }}
      js: ${{ steps.check.outputs.js }}
      rust: ${{ steps.check.outputs.rust }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the candidates whose files changed
        id: check
        env:
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          go=false js=false rust=false
          range=
          case $EVENT_NAME in
            pull_request) range="$BASE...$HEAD" ;;
            push)
              # A new branch's push has an all-zero before SHA.
              if [ -n "${BEFORE//0/}" ]; then
                range="$BEFORE..$AFTER"
              fi
              ;;
          esac

          if [ -n "$range" ] && files=$(git diff --name-only "$range"); then
            while IFS= read -r file; do
              case $file in
                *.go | go.mod | */go.mod | go.sum | */go.sum | go.work | riverdriver/*.sql | \
                  conformance/* | .github/workflows/conformance.yaml | Makefile) go=true ;;
                .github/actions/setup-js/* | js/*) js=true ;;
                rust/*) rust=true ;;
              esac
            done <<< "$files"
            reason="Compared $range."
          else
            go=true js=true rust=true
            reason="Couldn't compare with the previous commit, so everything runs."
          fi

          # Go is the reference for every candidate and generates the
          # fixtures, so a Go change runs them all.
          if [ "$go" = true ]; then
            js=true rust=true
          fi

          {
            echo "go=$go"
            echo "js=$js"
            echo "rust=$rust"
          } >> "$GITHUB_OUTPUT"
          echo "$reason Go: $go, JavaScript: $js, Rust: $rust." | tee -a "$GITHUB_STEP_SUMMARY"

  # Go against itself exercises the harness and River Go's adapter. Every
  # scenario runs on Postgres and SQLite in one job; the nightly workflow
  # covers older Postgres versions.
  harness_go:
    name: Conformance harness (Go)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: river_test
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/river_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          cache-dependency-path: conformance/go.sum
          go-version-file: go.work

      - name: Conformance scenarios
        run: make test/conformance CANDIDATE=go

  # River Go and River for JavaScript share one database in every scenario,
  # on Postgres and then SQLite. The nightly workflow covers older
  # Postgres versions, process kills, database faults, and performance.
  harness_js:
    name: Conformance harness (JavaScript)
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: river_test
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/river_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-js

      - uses: actions/setup-go@v7
        with:
          cache-dependency-path: conformance/go.sum
          go-version-file: go.work

      - name: Conformance scenarios
        run: make test/conformance/js

  # River Go and River Rust share one database in every scenario, on
  # Postgres and then SQLite. The nightly workflow covers older Postgres
  # versions, process kills, database faults, and performance.
  harness_rust:
    name: Conformance harness (Rust)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: river_test
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/river_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        id: rust

      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('rust/**/Cargo.toml', 'rust/Cargo.lock') }}
          restore-keys: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.cachekey }}-

      - uses: actions/setup-go@v7
        with:
          cache-dependency-path: conformance/go.sum
          go-version-file: go.work

      - name: Conformance scenarios
        run: make test/conformance/rust

  # The port workflows run only when their own files or dependencies change,
  # but their fixture tests compare against values generated from River Go.
  # When the Go side changes, this regenerates the fixtures and runs only the
  # port tests that read them.
  port_fixtures:
    name: Port fixture tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work

      - uses: dtolnay/rust-toolchain@stable
        id: rust

      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('rust/**/Cargo.toml', 'rust/Cargo.lock') }}
          restore-keys: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.cachekey }}-

      - uses: ./.github/actions/setup-js

      - uses: ./.github/actions/setup-java
        with:
          java-version: "21"

      # Each target generates the fixtures before running its tests.
      - name: Rust fixture tests
        run: make test/rust/conformance

      - name: JavaScript fixture tests
        run: make test/js/conformance

      - name: Java fixture tests
        run: make test/java/conformance

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: ruby
          bundler-cache: true

      - name: Ruby fixture tests
        run: make test/ruby/conformance
