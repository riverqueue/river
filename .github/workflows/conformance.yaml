name: Conformance

# The port workflows run only when their own files or dependencies change, but
# their fixture tests compare against values generated from River's Go code.
# This job closes that gap: when Go code, SQL queries the generator reads, or
# the generator itself changes, it regenerates the fixtures and runs only the
# port tests that read them. Keep both events' paths in sync.
on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/conformance.yaml"
      - "Makefile"
      - "**.go"
      - "**/go.mod"
      - "**/go.sum"
      - "conformance/**"
      - "go.work"
      - "riverdriver/**/*.sql"
  pull_request:
    paths:
      - ".github/workflows/conformance.yaml"
      - "Makefile"
      - "**.go"
      - "**/go.mod"
      - "**/go.sum"
      - "conformance/**"
      - "go.work"
      - "riverdriver/**/*.sql"

concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  # Cache reusable dependencies instead of incremental workspace builds.
  CARGO_INCREMENTAL: "0"

jobs:
  port_fixtures:
    name: Port fixture tests (SQLite and MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      RIVER_RUST_MYSQL_URL: mysql://root@127.0.0.1:3306/
      RIVER_TEST_DATABASE_URL: mysql://root@127.0.0.1:3306/
      TEST_MYSQL_URL: mysql://root@127.0.0.1:3306/

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work

      - uses: dtolnay/rust-toolchain@stable

      # Prune build artifacts and keep shared caches in master's branch scope.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          workspaces: rust -> target

      - uses: ./.github/actions/setup-js

      - uses: ./.github/actions/setup-java
        with:
          java-version: "21"

      # Each target generates the fixtures before running its tests.
      - name: Rust fixture tests
        run: make test/rust/conformance

      - name: Rust MySQL fixture tests
        run: make test/rust/conformance/mysql

      - name: JavaScript fixture tests
        run: make test/js/conformance

      - name: JavaScript MySQL fixture tests
        run: make test/js/conformance/mysql

      - name: Java fixture tests
        run: make test/java/conformance

      - name: Java MySQL fixture tests
        run: make test/java/conformance/mysql

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: ruby
          bundler-cache: true

      - name: Ruby fixture tests
        env:
          TEST_DATABASE: sqlite
        run: make test/ruby/conformance

      - name: Ruby MySQL fixture tests
        env:
          TEST_MYSQL_URL: mysql2://root@127.0.0.1:3306/
        run: make test/ruby/conformance/mysql
