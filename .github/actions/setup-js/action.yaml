name: Set up JavaScript workspace
description: >-
  Install pnpm and an official Node.js build, then install the locked
  dependencies of the workspace in `js/`.

inputs:
  node-version:
    default: ""
    description: >-
      Node.js version to use instead of the one in `js/.node-version`.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        package_json_file: js/package.json

    - uses: actions/setup-node@v7
      with:
        cache: pnpm
        cache-dependency-path: js/pnpm-lock.yaml
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && 'js/.node-version' || '' }}

    - name: Report Node.js version
      shell: bash
      run: node --version

    - run: pnpm install --frozen-lockfile
      shell: bash
      working-directory: js
