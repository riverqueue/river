[workspace]
members = [
    "riverqueue",
    "riverqueue-conformance",
    "riverqueue-internal",
    "riverqueue-macros",
    "riverqueue-migrate",
    "riverqueue-test",
]
resolver = "3"

[workspace.package]
authors = ["Riverqueue contributors"]
edition = "2024"
homepage = "https://riverqueue.com"
license = "MPL-2.0"
repository = "https://github.com/riverqueue/river"
rust-version = "1.95"
version = "0.44.0-alpha.1"

[workspace.dependencies]
async-trait = "0.1.92"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
cron = "0.17.0"
futures-util = "0.3.34"
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "derive", "json", "runtime-tokio", "tls-rustls"] }
syn = { version = "2.0", features = ["full"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
