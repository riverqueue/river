[package]
name = "riverqueue-macros"
description = "Derive macros for River's Rust client"
keywords = ["background", "derive", "jobs", "queue"]
categories = ["asynchronous", "database", "development-tools::procedural-macro-helpers"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
# Only what builds and documents the crate ships; tests and their fixtures stay
# in the repository.
include = ["src/**", "LICENSE", "README.md"]

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[dev-dependencies]
riverqueue = { path = "../riverqueue" }
serde.workspace = true
trybuild = "1.0.121"

[lints]
workspace = true
